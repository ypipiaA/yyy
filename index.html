<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack - 健身助手</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <span class="logo">💪</span>
        <h1>FitTrack</h1>
      </div>
      <p class="header-sub">你的私人健身助手</p>
    </header>

    <nav class="nav">
      <button class="nav-btn active" data-tab="plan">训练计划</button>
      <button class="nav-btn" data-tab="workout">开始训练</button>
      <button class="nav-btn" data-tab="timer">休息计时</button>
      <button class="nav-btn" data-tab="stats">进度统计</button>
    </nav>

    <main class="main">
      <!-- 训练计划 -->
      <section id="tab-plan" class="tab active">
        <div class="card">
          <h2>生成训练计划</h2>
          <form id="plan-form" class="form">
            <label>
              训练目标
              <select id="goal" required>
                <option value="muscle">增肌塑形</option>
                <option value="fat">减脂燃脂</option>
                <option value="strength">力量提升</option>
                <option value="endurance">耐力训练</option>
              </select>
            </label>
            <label>
              每周训练天数
              <select id="days" required>
                <option value="3">3 天</option>
                <option value="4">4 天</option>
                <option value="5">5 天</option>
                <option value="6">6 天</option>
              </select>
            </label>
            <label>
              经验水平
              <select id="level" required>
                <option value="beginner">新手</option>
                <option value="intermediate">中级</option>
                <option value="advanced">高级</option>
              </select>
            </label>
            <button type="submit" class="btn btn-primary">生成计划</button>
          </form>
        </div>

        <div id="plan-result" class="card hidden">
          <div class="card-header">
            <h2 id="plan-title">你的训练计划</h2>
            <button id="save-plan" class="btn btn-secondary">保存计划</button>
          </div>
          <div id="plan-days" class="plan-days"></div>
        </div>

        <div id="saved-plan" class="card hidden">
          <h2>当前计划</h2>
          <div id="saved-plan-content"></div>
        </div>
      </section>

      <!-- 开始训练 -->
      <section id="tab-workout" class="tab">
        <div class="card">
          <h2>今日训练</h2>
          <div id="workout-empty" class="empty-state">
            <p>请先在「训练计划」中生成并保存计划</p>
          </div>
          <div id="workout-content" class="hidden">
            <label>
              选择训练日
              <select id="workout-day"></select>
            </label>
            <div id="exercise-list" class="exercise-list"></div>
            <button id="finish-workout" class="btn btn-primary">完成训练</button>
          </div>
        </div>

        <div class="card">
          <h2>训练历史</h2>
          <div id="workout-history" class="history-list"></div>
        </div>
      </section>

      <!-- 休息计时 -->
      <section id="tab-timer" class="tab">
        <div class="card timer-card">
          <h2>休息计时器</h2>
          <div class="timer-display" id="timer-display">01:30</div>
          <div class="timer-presets">
            <button class="btn btn-preset" data-seconds="60">60秒</button>
            <button class="btn btn-preset active" data-seconds="90">90秒</button>
            <button class="btn btn-preset" data-seconds="120">2分钟</button>
            <button class="btn btn-preset" data-seconds="180">3分钟</button>
          </div>
          <label class="timer-custom">
            自定义（秒）
            <input type="number" id="timer-custom" min="10" max="600" value="90">
          </label>
          <div class="timer-controls">
            <button id="timer-start" class="btn btn-primary">开始</button>
            <button id="timer-pause" class="btn btn-secondary hidden">暂停</button>
            <button id="timer-reset" class="btn btn-secondary">重置</button>
          </div>
        </div>
      </section>

      <!-- 进度统计 -->
      <section id="tab-stats" class="tab">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">总训练次数</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-week">0</span>
            <span class="stat-label">本周训练</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-streak">0</span>
            <span class="stat-label">连续天数</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-volume">0</span>
            <span class="stat-label">总训练量(kg)</span>
          </div>
        </div>

        <div class="card">
          <h2>每周训练频率</h2>
          <canvas id="chart-weekly"></canvas>
        </div>

        <div class="card">
          <h2>动作进步曲线</h2>
          <label>
            选择动作
            <select id="chart-exercise"></select>
          </label>
          <canvas id="chart-progress"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="js/exercises.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
