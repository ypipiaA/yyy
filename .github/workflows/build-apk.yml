name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          # Bubblewrap requires androidSdkPath to contain bin/sdkmanager directly.
          # Symlink SDK_ROOT/bin -> cmdline-tools/latest/bin so we can point it at
          # the real SDK root, keeping every SDK path consistent for Gradle.
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          ls "$ANDROID_HOME/bin/sdkmanager"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME_17_X64" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Generate signing keystore
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair \
            -dname "CN=ypipiaA, OU=Engineering, O=FutureSparkZone, C=CN" \
            -alias fittrack -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore android.keystore -storepass "$KS_PASS" -keypass "$KS_PASS"

      - name: Generate Android project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          set -o pipefail
          bubblewrap doctor 2>&1 | tee doctor.log || true
          bubblewrap update --skipVersionUpgrade 2>&1 | tee update.log

      - name: Build APK with Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          set -o pipefail
          bubblewrap build --skipPwaValidation 2>&1 | tee build.log

      - name: Push debug logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/dbg && cp -f *.log /tmp/dbg/ 2>/dev/null || true
          cd /tmp/dbg && git init -q && git config user.email ci@local && git config user.name ci
          git add -A && git commit -qm "ci debug logs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/ypipiaA/yyy.git" HEAD:refs/heads/ci-debug

      - name: Generate assetlinks.json
        run: |
          fingerprint=$("$JAVA_HOME_17_X64/bin/keytool" -list -v -keystore android.keystore -storepass "$KS_PASS" | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          echo "Signing key SHA256: $fingerprint"
          printf '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "org.futuresparkzone.fittrack", "sha256_cert_fingerprints": ["%s"]}}]\n' "$fingerprint" > assetlinks.json
          cat assetlinks.json

      - name: Save keystore password for artifact
        run: echo "$KS_PASS" > keystore-password.txt

      - name: Upload build artifacts (private)
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            android.keystore
            keystore-password.txt
            assetlinks.json

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1-android app-release-signed.apk assetlinks.json \
            --title "FitTrack v3.1 Android APK" \
            --notes "FitTrack 安卓安装包（TWA，由 Bubblewrap 构建）。下载 app-release-signed.apk 到手机安装即可。" \
            || gh release upload v3.1-android app-release-signed.apk assetlinks.json --clobber
