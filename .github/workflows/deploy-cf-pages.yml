name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude backend --exclude docs --exclude .github \
            --exclude .git --exclude twa-manifest.json --exclude '*.md' \
            ./ /tmp/site/
          ls /tmp/site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy /tmp/site --project-name=fittrack --branch=main --commit-dirty=true
